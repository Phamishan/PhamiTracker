name = "phamitracker"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The poller. Every minute it picks the players that are due (see src/poller.js) and asks the
# Apex / VALORANT APIs for their latest rank, so stats are recorded even with the app closed.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "phamitracker"
database_id = "118f333b-0dcf-40f0-9aee-61738da02631"
migrations_dir = "migrations"

[vars]
# Apex split dates read off the game (Ranked tab). They override apexseasons.online until the end
# date passes, then scraping takes over again. Update or remove them each split.
APEX_SEASON = "Season 31 · Cipher"
APEX_SPLIT = "1"
APEX_SPLIT_START = "2026-11-03T18:00:00Z"
# In-game on 9 Nov 19:04 (Danish time): 35d 23h left -> 15 Dec, at the usual 10:00 Pacific reset.
APEX_SPLIT_END = "2026-12-15T18:00:00Z"
# Per-cron-run caps that keep us under the API keys' rate limits
# (apexlegendsapi.com: 2 req/s, HenrikDev basic key: 30 req/min). Apex polls start 600 ms apart,
# so 90 take ~54 s and leave room for the app's own refreshes and searches.
APEX_POLLS_PER_RUN = "90"
VALORANT_POLLS_PER_RUN = "8"
# LOL: a personal Riot key allows 100 requests per 2 minutes, and a check is 2-3 of them.
LOL_POLLS_PER_RUN = "12"
# LOL split dates (Riot has no API for them), like Apex's. After the end the next split runs from
# it until these are updated. Leave unset to use the last 90 days.
LOL_SPLIT_NAME = "Season 2026"
# Start: the 2026 season's opening (only shown as a date: no LOL games were recorded before then).
LOL_SPLIT_START = "2026-01-08T11:00:00Z"
# Countdown on 27 Nov (11:15 EUW): 40 days 12:44:58 to 23:59:59 server time -> 6 Jan 2027 (CET).
LOL_SPLIT_END = "2027-01-06T22:59:59Z"
# Players whose app/widget hasn't asked for data in this many days stop being polled.
INACTIVE_AFTER_DAYS = "21"
# A search tracks the player (every 5-10 min, like a favourite) for this long after the last
# search, the same as INACTIVE_AFTER_DAYS for linked accounts.
SEARCH_TRACK_DAYS = "21"

[observability]
enabled = true

# Secrets (wrangler secret put <NAME>):
#   APEX_API_KEY      - https://apexlegendsapi.com
#   HENRIK_API_KEY    - https://docs.henrikdev.xyz
#   RIOT_API_KEY      - https://developer.riotgames.com (LOL)
#   APP_KEY           - shared key the app sends as X-App-Key
#   APNS_KEY          - (optional) Apple push key (.p8 contents) for Live Activity updates
#   APNS_KEY_ID       - (optional) that key's id
#   APNS_TEAM_ID      - (optional) your Apple developer team id
